# CI quality gates (spec sections 21 and 22): Python lint/format/tests/types,
# frontend lint/typecheck/tests/build, and the public-data privacy scan.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Type check
        run: uv run mypy src

  web:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Node 20 is the supported runtime this project is engineered around
          # (Vite is pinned to ^6 because local Node 20.18 < Vite 7's 20.19 floor).
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir web lint

      - name: Type check
        run: pnpm --dir web typecheck

      - name: Tests
        run: pnpm --dir web test

      - name: Build
        run: pnpm --dir web build

  privacy-scan:
    name: Public data privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Scan public data for prohibited fields
        run: uv run pytest -k privacy
