# All scoring weights, caps, thresholds, and minimum-sample rules
# (spec sections 13, 16, 17). No scoring number may exist only in source code.

# Spec section 13: event weights for meaningful-activity scoring.
event_weights:
  merged_pull_request: 5
  pull_request_review: 4
  pull_request_opened: 3
  release: 3
  push_event: 2
  issue_opened: 1
  issue_comment: 1

# Spec 16.1: repository quality score components (must sum to 1.0).
# signal_weights blend the sub-signals inside each component (each block must
# sum to 1.0); formula shapes are documented in
# src/codetalent/scoring/repository.py — every number lives here (spec 8.3).
repository_quality:
  weights:
    recent_activity: 0.30
    contributor_diversity: 0.25
    collaboration_quality: 0.20
    technical_relevance: 0.15
    repository_maturity: 0.10
  winsorization_percentile: 0.99
  signal_weights:
    recent_activity:
      active_months: 0.25
      active_days: 0.20
      recency: 0.20
      releases: 0.10
      weighted_activity: 0.25
    contributor_diversity:
      unique_contributors: 0.50
      low_concentration: 0.30
      recurring_activity: 0.20
    collaboration_quality:
      merged_pull_requests: 0.35
      reviews: 0.30
      review_to_pr_ratio: 0.20
      issue_participation: 0.15
    technical_relevance:
      classification_score: 0.60
      evidence_breadth: 0.25
      negative_evidence_absence: 0.15
    repository_maturity:
      recognized_license: 0.30
      releases: 0.25
      ci_signal: 0.15
      tests_signal: 0.15
      governance_docs: 0.15
  thresholds:
    # A repository counts as having recurring contribution activity when it
    # was active in at least this many distinct months (spec 16.1 recurring
    # contributor share, proxied — see repository.py docstring).
    recurring_activity_min_months: 2
    # Review-to-PR ratio at which the review-coverage subscore saturates.
    review_ratio_full_coverage: 1.0
    # Matched negative-evidence count at which the relevance penalty saturates.
    negative_evidence_full_penalty: 3

# Spec 16.2: contributor expert score components (must sum to 1.0) and bias safeguards.
contributor_expert:
  weights:
    domain_activity: 0.35
    contribution_quality: 0.25
    repository_quality_exposure: 0.20
    continuity: 0.10
    collaboration: 0.10
  caps:
    single_repository_share: 0.40
    # Spec 16.2 push-volume cap: push events counted per contributor-repository
    # pair are clipped here before any weighting, so bulk pushing cannot
    # dominate the contribution-evidence mix.
    push_events_counted_max: 100
  minimums:
    meaningful_active_days: 2
  winsorization_percentile: 0.99
  signal_weights:
    domain_activity:
      event_points: 0.50
      qualified_repo_count: 0.25
      subdomain_breadth: 0.25
    continuity:
      active_months: 0.40
      recency: 0.30
      activity_span: 0.30
    collaboration:
      reviews: 0.40
      pull_request_participation: 0.30
      repo_org_breadth: 0.30

# Spec section 17: geographic opportunity score components (must sum to 1.0).
opportunity:
  weights:
    expert_supply: 0.35
    expert_quality: 0.30
    collaboration_depth: 0.15
    momentum: 0.10
    ecosystem_breadth: 0.10

# Spec section 17: confidence score components (must sum to 1.0), kept separate
# from opportunity.
confidence:
  weights:
    located_profile_coverage: 0.35
    location_certainty: 0.25
    sample_size_adequacy: 0.20
    repository_diversity: 0.10
    organization_diversity: 0.10

# Spec section 17: minimum sample rules. Below these, a geography is
# insufficient_data and gets no normal rank.
minimum_samples:
  country:
    located_contributors: 30
    qualified_repositories: 10
    organizations: 5
  city:
    high_confidence_located_contributors: 25
    qualified_repositories: 8
    organizations: 4

# Spec section 17 recommendation tiers:
#   priority:          opportunity >= 75 and confidence >= 70
#   promising:         opportunity >= 60 and confidence >= 60
#   monitor:           opportunity >= 45 or confidence in [45, 59]
#   insufficient_data: sample rule failed or confidence < 45
tiers:
  priority:
    min_opportunity: 75
    min_confidence: 70
  promising:
    min_opportunity: 60
    min_confidence: 60
  monitor:
    min_opportunity: 45
    confidence_band_min: 45
    confidence_band_max: 59
  insufficient_data:
    max_confidence: 45

# Spec sections 8.2 and 17: concentration safeguards.
concentration:
  organization_share_flag: 0.20
  single_actor_event_share_max: 0.90

# Spec section 17: geography scaling constants and sub-signal weights
# (formula shapes documented in src/codetalent/scoring/geography.py).
geography:
  winsorization_percentile: 0.99
  # Elite cap: a contributor's weight in a geography's weighted supply is
  # min(expert_score, this cap) / 100, so a few very high scores cannot
  # replace headcount (spec 17 expert supply).
  supply_expert_score_cap: 85.0
  # Spec 17 concentration safeguard: one repository's contribution to a
  # geography's weighted supply is capped at this share of the total.
  single_repository_supply_share_max: 0.40
  # Expert-quality "top quartile" membership threshold percentile, computed
  # over all located contributors in the domain.
  top_quartile_percentile: 0.75
  # Sample-size adequacy saturates (reaches 100) at minimum * this multiple.
  sample_saturation_multiple: 2.0
  # A contributor counts as recurring (spec 17 collaboration depth) when
  # active in at least this many distinct months.
  recurring_contributor_min_months: 2
  # Number of subdomains listed per geography, ordered by weighted activity.
  top_subdomains_count: 5
  # Pilot momentum is PROVISIONAL: month-over-month direction only (spec 17).
  momentum_direction_scores:
    up: 75.0
    flat: 50.0
    down: 25.0
  signal_weights:
    expert_quality:
      weighted_median: 0.70
      top_quartile_share: 0.30
    collaboration_depth:
      multi_repo_share: 0.40
      review_participation: 0.30
      recurring_share: 0.30
    ecosystem_breadth:
      qualified_repos: 0.30
      organizations: 0.25
      subdomain_breadth: 0.20
      low_concentration: 0.25

# Spec section 12 (Milestone C): deterministic taxonomy classification.
# Per-match evidence weights: a topic match is the strongest signal; a term
# match in the description is weaker; a term match in the repository name sits
# in between; file/content signals (e.g. has_ci) and primary-language hints
# are weak corroboration. Each matched negative term subtracts
# negative_weight. A repository is accepted when its best subdomain score
# reaches accept_threshold AND it shows at least min_evidence_kinds distinct
# evidence kinds (topic / description term / name term / file signal /
# language hint); scores in [borderline_threshold, accept_threshold) or
# strong scores with too few evidence kinds are borderline.
classification:
  topic_weight: 3.0
  term_weight: 1.0
  name_weight: 1.5
  file_weight: 1.0
  language_weight: 1.0
  negative_weight: 2.0
  accept_threshold: 4.0
  borderline_threshold: 2.0
  min_evidence_kinds: 2
