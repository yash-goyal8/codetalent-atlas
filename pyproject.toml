[project]
name = "codetalent"
version = "0.1.0"
description = "CodeTalent Atlas: public-data sourcing intelligence for expert coding contributors."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "polars>=1.12",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "httpx>=0.27",
    "google-cloud-bigquery>=3.42.3",
    "pycountry>=26.2.16",
    "country-converter>=1.3.2",
    "geonamescache>=3.0.2",
]

[project.scripts]
codetalent = "codetalent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codetalent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

[tool.mypy]
mypy_path = "src"
packages = ["codetalent"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
# google-cloud-bigquery and pyarrow ship without complete type stubs; scoped
# ignores only — the rest of the codebase stays strictly typed.
module = [
    "google.cloud.*",
    "google.api_core.*",
    "google.auth.*",
    "pyarrow.*",
    "country_converter.*",
    "geonamescache.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Resolve the package from src/ directly so tests never depend on the
# editable-install .pth being processed (macOS site.py skips hidden .pth files).
pythonpath = ["src"]
